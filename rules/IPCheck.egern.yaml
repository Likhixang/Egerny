# 规则名称: IPCheck
# 说明: IP 检测 / 质检站点统一走同一策略组，避免在其它 IP 查询站测到的不是节点出口 IP
# 覆盖: 73 个域名，按用途分组
# 用法: 已被 sgmodule/IPCheck.yaml 通过 rule_set 引用；也可在 Profile 的 rules 中直接引用

domain_suffix_set:
  # 脚本自身数据源（必需）
  - ip.net.coffee
  - ipfinal.com
  # 多源聚合 / IP 纯净度检测
  - ipcheck.ing
  - ping0.cc
  - ip111.cn
  - ip125.com
  - ipuu.net
  - iplark.com
  - ip.skk.moe
  - ip.check.place
  - ip.fm
  # 中文 IP 查询
  - ip.cn
  - ip138.com
  - ipip.net
  - cip.cc
  - chinaz.com
  - ip.sb
  - ip.gs
  - ip.me
  - ip.wtf
  - myip.la
  # 国际 echo / What is my IP
  - ipify.org
  - ifconfig.me
  - ifconfig.co
  - icanhazip.com
  - major.io
  - ident.me
  - seeip.org
  - myip.com
  - ipchicken.com
  - whatismyip.com
  - whatismyipaddress.com
  - ipaddress.com
  - whatleaks.com
  - ip-check.info
  - ip-tracker.org
  # 地理 / ASN / 风控查询 API
  - ipinfo.io
  - ip-api.com
  - ip-api.io
  - ipapi.co
  - ipapi.com
  - ipapi.is
  - ipwho.is
  - ipwhois.app
  - ipwhois.io
  - ipdata.co
  - ipstack.com
  - ipregistry.co
  - ipbase.com
  - freeipapi.com
  - geojs.io
  - ipquery.io
  - ipfind.co
  - ip2location.com
  - ipgeolocation.io
  - db-ip.com
  - maxmind.com
  - ipqualityscore.com
  - scamalytics.com
  - abuseipdb.com
  - ipfingerprints.com
  - iplocation.net
  # 泄漏 / 匿名度检测
  - whoer.net
  - browserleaks.com
  - ipleak.net
  - dnsleaktest.com
  - mullvad.net
  # IPv6 / 网络工具
  - test-ipv6.com
  - ipv6-test.com
  - ping.pe
  - itdog.cn
  - 17ce.com
  - boce.com
