name: "IP-Pure"
description: "节点 IP 纯净度检测（IPPure），新式小组件，支持主屏全部尺寸，数据源 my.ippure.com"

# 策略组路由参数（用于规则匹配）
compat_arguments:
  Proxy: "DIRECT"
compat_arguments_desc: |
  Proxy: 检测请求走的策略组，默认 DIRECT

# 模块可视化配置控件 (Egern 2.16+)
env_schema:
  MarkIP:
    name: IP 打码
    description: "是否对 IP 地址打码显示"
    options:
      - "true"
      - "false"

scriptings:
  - generic:
      name: IP-Pure
      script_url: https://raw.githubusercontent.com/Likhixang/Egerny/main/js/IPPure-widget.js
      timeout: 15
      env:
        MarkIP: "false"

widgets:
  - name: IP-Pure
    script_name: IP-Pure

rules:
  - domain_suffix:
      match: ippure.com
      policy: "{{{Proxy}}}"
