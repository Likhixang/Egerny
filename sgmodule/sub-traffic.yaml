name: "订阅流量"
description: "最多显示 10 个机场 / 代理订阅的剩余流量、今日已用、近 7 天用量柱状图、用完预测与到期 / 重置倒计时（iOS 液态玻璃风格，支持主屏小 / 中 / 大与锁屏三种尺寸）"

env_schema:
  SUB1_URL:
    name: 订阅1 链接
    description: 第 1 个订阅地址（必填）
    default_value: ""
  SUB1_NAME:
    name: 订阅1 名称
    description: 显示在组件上的名称
    default_value: ""
  SUB1_TOTAL_GB:
    name: 订阅1 套餐总量 (GB)
    description: 订阅只返回剩余流量时用来估算总量，留空默认 100
    default_value: ""
  SUB1_RESET_DAY:
    name: 订阅1 流量重置日
    description: 每月几号重置（1~31），留空不显示
    default_value: ""
  SUB2_URL:
    name: 订阅2 链接
    description: 第 2 个订阅地址（可选）
    default_value: ""
