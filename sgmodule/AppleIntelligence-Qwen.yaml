name: "Apple 智能换模型（问千问）"
description: "把国行 Apple 智能的「问千问」、视觉智能与写作工具改接到任意 OpenAI 兼容 provider。画图不接管，仍走千问。按原 SSE 事件壳回包，Siri / 写作工具无感知。"
author: "Li Khixang"
homepage: "https://github.com/Likhixang"
manual: "https://raw.githubusercontent.com/Likhixang/Egerny/main/markdown/AppleIntelligence-Qwen.md"
icon: "sparkles"

# 未主动填写时不会写入 env，脚本会在 Siri 里直接回一条「配置错误」而不是静默失败。
env_schema:
  PROVIDER_URL:
    name: 接口地址
    description: "填到 /v1 即可，会自动补 /chat/completions；只填域名也行，会自动补 /v1。"
    default_value: "https://api.openai.com/v1"
  API_KEY:
    name: 密钥
    description: "Bearer 密钥。本地网关无鉴权时留空。"
    default_value: ""
  MODEL:
    name: 模型
    description: "传给 provider 的 model 字段。"
    default_value: ""
  SYSTEM_PROMPT:
    name: 系统提示词
    description: "留空使用内置默认：简洁、准确、口语化，只输出最终答案。"
    default_value: ""
  VISION_MODEL:
    name: 视觉模型
    description: "处理视觉智能图片时用的模型；留空复用上面的模型。主模型不支持图片时填一个多模态模型。"
    default_value: ""
  VISION_PROMPT:
    name: 视觉提示词
    description: "视觉智能只发图片、不发文字，用这句引导模型作答。留空用内置默认。"
    default_value: ""
  WRITING_MODEL:
    name: 写作模型
    description: "写作工具改写用的模型；留空复用上面的模型。改写质量要求高时单独指一个更强的。"
    default_value: ""
  WRITING_PROMPT:
    name: 写作提示词
    description: "写作工具的系统提示词，必须让模型输出 {body, refinements}。留空用内置默认。"
    default_value: ""
  TIMEOUT:
    name: 超时秒数
    description: "等待上游返回的时间，默认 120，最大 300。"
    default_value: "120"
  REPORT_MODEL:
    name: 上报模型名
    description: "回给 Siri 的 model 字段，默认与真实后端一致。"
    default_value: "qwenapp-apple-tqa"
  CONTINUE_URL:
    name: 跳转链接
    description: "Siri 回答下方的「继续在 App 中查看」。留空则不显示。"
    default_value: ""
  NOTIFY_ON_ERROR:
    name: 出错时通知
    description: "上游失败时发一条系统通知，便于排查。"
    options:
      - "true"
      - "false"
    default_value: "false"

scriptings:
  - http_request:
      name: "Apple-Intelligence-Qwen"
      match: "^https://prod-yabuli\\.qianwen\\.com/v1/sessions(/sess_[^/?#]+)?/responses"
      script_url: "https://raw.githubusercontent.com/Likhixang/Egerny/main/js/AppleIntelligence-Qwen.js"
      body_required: true
      max_size: 4194304   # 视觉智能的请求体带 base64 图片，实测约 200KB，留足余量
      timeout: 300
      env:
        # 留空占位：模块设置页（env_schema）写入的模块级 env 会覆盖这里的同名值。
        PROVIDER_URL: ""
        API_KEY: ""
        MODEL: ""
        SYSTEM_PROMPT: ""
        VISION_MODEL: ""
        VISION_PROMPT: ""
        WRITING_MODEL: ""
        WRITING_PROMPT: ""
        TIMEOUT: "120"
        REPORT_MODEL: "qwenapp-apple-tqa"
        CONTINUE_URL: ""
        NOTIFY_ON_ERROR: "false"


# 只解密这一个域名。苹果自己的 guzzoni / gateway.icloud.com.cn 有 pinning，加进来没意义还会拖慢连接。
mitm:
  hostnames:
    - "prod-yabuli.qianwen.com"

http_captures:
  - "prod-yabuli.qianwen.com"
