name: "Apple 智能换模型（问千问 / 识图）"
description: "国行 Apple 智能改接自定义 provider；百度识图换 Google Lens；画图仍走千问。"
author: "Li Khixang"
homepage: "https://github.com/Likhixang"
manual: "https://raw.githubusercontent.com/Likhixang/Egerny/main/markdown/AppleIntelligence-Qwen.md"
icon: "sparkles"

# 两项能力各自独立：Siri 那套需要 PROVIDER_URL/MODEL，识图那套需要 SERPAPI_KEY。
# 没填的部分不会接管，原样走苹果/百度。
env_schema:
  MODEL:
    name: 模型
    description: "填模型名；留空则不接管，继续走千问。"
    default_value: ""
  PROVIDER_URL:
    name: 接口地址
    description: "OpenAI 兼容接口，填到 /v1 即可。"
    default_value: "https://api.openai.com/v1"
  API_KEY:
    name: 密钥
    description: "Bearer 密钥；本地网关留空。"
    default_value: ""
  EFFORT:
    name: 思考强度
    description: "reasoning_effort 档位；default 不发送。"
    options:
      - "default"
      - "off"
      - "low"
      - "medium"
      - "high"
      - "xhigh"
      - "max"
    default_value: "default"
  EXTRA_BODY:
    name: 额外请求字段
    description: "并入请求体的 JSON，用于私有参数。"
    default_value: ""
  WEB_SEARCH:
    name: 搜索来源
    description: "provider：模型按需联网；qwen：千问判断；tavily/serpapi：先判断再检索；off：关闭。"
    options:
      - "provider"
      - "qwen"
      - "tavily"
      - "serpapi"
      - "off"
    default_value: "provider"
  SEARCH_KEY:
    name: 检索密钥
    description: "Tavily / SerpAPI 的 key；SerpAPI 留空则复用识图密钥。"
    default_value: ""
  SEARCH_JUDGE:
    name: 先判断再搜
    description: "Tavily / SerpAPI 先用模型判断是否需要联网。"
    options:
      - "true"
      - "false"
    default_value: "true"
  SEARCH_JUDGE_MODEL:
    name: 判断模型
    description: "留空用主模型；建议填一个快模型。"
    default_value: ""
  SYSTEM_PROMPT:
    name: 系统提示词
    description: "留空使用内置默认。"
    default_value: ""
  VISION_MODEL:
    name: 视觉模型
    description: "识图模型；留空复用主模型。"
    default_value: ""
  VISION_PROMPT:
    name: 视觉提示词
    description: "识图引导语；留空用默认。"
    default_value: ""
  WRITING_MODEL:
    name: 写作模型
    description: "改写模型；留空复用主模型。"
    default_value: ""
  WRITING_PROMPT:
    name: 写作提示词
    description: "改写提示词，输出 {body, refinements}。"
    default_value: ""
  SERPAPI_KEY:
    name: SerpAPI 密钥
    description: "SerpAPI 密钥；留空走百度识图。"
    default_value: ""
  HL:
    name: 识图语言
    description: "Google 语言代码，默认 zh-cn。"
    default_value: "zh-cn"
  COUNTRY:
    name: 识图国家
    description: "Google 国家代码，默认 us。"
    default_value: "us"
  LENS_TYPE:
    name: 识图类型
    description: "all / visual_matches / exact_matches。"
    options:
      - "all"
      - "visual_matches"
      - "exact_matches"
    default_value: "all"
  TIMEOUT:
    name: 超时秒数
    description: "超时秒数，最大 300。"
    default_value: "120"
  REPORT_MODEL:
    name: 上报模型名
    description: "回给 Siri 的 model 字段。"
    default_value: "qwenapp-apple-tqa"
  CONTINUE_URL:
    name: 跳转链接
    description: "回答下方的跳转链接。"
    default_value: ""
  NOTIFY_ON_ERROR:
    name: 出错时通知
    description: "失败时发送系统通知。"
    options:
      - "true"
      - "false"
    default_value: "true"

scriptings:
  - http_request:
      name: "Apple-Intelligence"
      # Siri 对话 / 视觉智能 / 写作工具 + 百度识图
      match: "^https://(prod-yabuli\\.qianwen\\.com/v1/sessions(/sess_[^/?#]+)?/responses|qianfan\\.baidubce\\.com/v1/images/search)"
      script_url: "https://raw.githubusercontent.com/Likhixang/Egerny/main/js/AppleIntelligence-Qwen.js"
      body_required: true
      max_size: 4194304   # 视觉智能的请求体带 base64 图片，实测约 200KB，留足余量
      timeout: 300
      env:
        # 留空占位：模块设置页（env_schema）写入的模块级 env 会覆盖这里的同名值。
        PROVIDER_URL: ""
        API_KEY: ""
        MODEL: ""
        EFFORT: "default"
        EXTRA_BODY: ""
        WEB_SEARCH: "provider"
        SEARCH_KEY: ""
        SEARCH_JUDGE: "true"
        SEARCH_JUDGE_MODEL: ""
        SYSTEM_PROMPT: ""
        VISION_MODEL: ""
        VISION_PROMPT: ""
        WRITING_MODEL: ""
        WRITING_PROMPT: ""
        SERPAPI_KEY: ""
        HL: "zh-cn"
        COUNTRY: "us"
        LENS_TYPE: "all"
        TIMEOUT: "120"
        REPORT_MODEL: "qwenapp-apple-tqa"
        CONTINUE_URL: ""
        NOTIFY_ON_ERROR: "true"

# 只解密这两个域名。苹果自己的 guzzoni / gateway.icloud.com.cn 有 pinning，加进来没意义还会拖慢连接。
mitm:
  hostnames:
    - "prod-yabuli.qianwen.com"
    - "qianfan.baidubce.com"

http_captures:
  - "prod-yabuli.qianwen.com"
  - "qianfan.baidubce.com"
