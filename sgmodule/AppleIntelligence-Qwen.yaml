name: "Apple 智能换模型（问千问）"
description: "把国行 Apple 智能的「问千问」与视觉智能改接到任意 OpenAI 兼容 provider。拦截 prod-yabuli.qianwen.com，支持文本、出图、图片识别，按原 SSE 事件壳回包，Siri 无感知。"
author: "Li Khixang"
homepage: "https://github.com/Likhixang"
manual: "https://raw.githubusercontent.com/Likhixang/Egerny/main/markdown/AppleIntelligence-Qwen.md"
icon: "sparkles"

# 未主动填写时不会写入 env，脚本会在 Siri 里直接回一条「配置错误」而不是静默失败。
env_schema:
  PROVIDER_URL:
    name: 接口地址
    description: "填到 /v1 即可，会自动补 /chat/completions；只填域名也行，会自动补 /v1。"
    default_value: "https://api.openai.com/v1"
  API_KEY:
    name: 密钥
    description: "Bearer 密钥。本地网关无鉴权时留空。"
    default_value: ""
  MODEL:
    name: 模型
    description: "传给 provider 的 model 字段。"
    default_value: ""
  SYSTEM_PROMPT:
    name: 系统提示词
    description: "留空使用内置默认：简洁、准确、口语化，只输出最终答案。"
    default_value: ""
  VISION_MODEL:
    name: 视觉模型
    description: "处理视觉智能图片时用的模型；留空复用上面的模型。主模型不支持图片时填一个多模态模型。"
    default_value: ""
  VISION_PROMPT:
    name: 视觉提示词
    description: "视觉智能只发图片、不发文字，用这句引导模型作答。留空用内置默认。"
    default_value: ""
  TIMEOUT:
    name: 超时秒数
    description: "等待上游返回的时间，默认 120，最大 300。"
    default_value: "120"
  REPORT_MODEL:
    name: 上报模型名
    description: "回给 Siri 的 model 字段，默认与真实后端一致。"
    default_value: "qwenapp-apple-tqa"
  CONTINUE_URL:
    name: 跳转链接
    description: "Siri 回答下方的「继续在 App 中查看」。留空则不显示。"
    default_value: ""
  NOTIFY_ON_ERROR:
    name: 出错时通知
    description: "上游失败时发一条系统通知，便于排查。"
    options:
      - "true"
      - "false"
    default_value: "false"

  IMAGE_ENABLE:
    name: 启用出图
    description: "开启后会把 image_generator 工具交给模型，模型决定是否画图。"
    options:
      - "true"
      - "false"
    default_value: "true"
  IMAGE_URL:
    name: 图像接口地址
    description: "同样填到 /v1 即可，会自动补 /images/generations。留空则不出图。"
    default_value: "https://api.openai.com/v1"
  IMAGE_MODEL:
    name: 图像模型
    description: "例如 dall-e-3、gpt-image-1、flux-schnell。"
    default_value: ""
  IMAGE_SIZE:
    name: 图片尺寸
    description: "宽x高，例如 1024x1024、1792x1024。"
    default_value: "1024x1024"
  IMAGE_KEY:
    name: 图像接口密钥
    description: "留空则复用上面的密钥。"
    default_value: ""
  IMAGE_TIMEOUT:
    name: 出图超时秒数
    description: "图片接口较慢，默认 180。"
    default_value: "180"
  IMAGE_UPLOAD_URL:
    name: base64 转存地址
    description: "gpt-image 系列只回 base64，需要一个接收 POST {image,mimeType} 并返回 {url} 的地址；留空则这类模型会降级为纯文本。"
    default_value: ""
  IMAGE_DESCRIBE:
    name: 生成图片描述
    description: "额外调用一次模型写一句图片描述，会多一次请求。"
    options:
      - "false"
      - "true"
    default_value: "false"

scriptings:
  - http_request:
      name: "Apple-Intelligence-Qwen"
      match: "^https://prod-yabuli\\.qianwen\\.com/v1/sessions(/sess_[^/?#]+)?/responses"
      script_url: "https://raw.githubusercontent.com/Likhixang/Egerny/main/js/AppleIntelligence-Qwen.js"
      body_required: true
      max_size: 4194304   # 视觉智能的请求体带 base64 图片，实测约 200KB，留足余量
      timeout: 300
      env:
        # 留空占位：模块设置页（env_schema）写入的模块级 env 会覆盖这里的同名值。
        PROVIDER_URL: ""
        API_KEY: ""
        MODEL: ""
        SYSTEM_PROMPT: ""
        VISION_MODEL: ""
        VISION_PROMPT: ""
        TIMEOUT: "120"
        REPORT_MODEL: "qwenapp-apple-tqa"
        CONTINUE_URL: ""
        NOTIFY_ON_ERROR: "false"
        IMAGE_ENABLE: "true"
        IMAGE_URL: ""
        IMAGE_MODEL: ""
        IMAGE_SIZE: "1024x1024"
        IMAGE_KEY: ""
        IMAGE_TIMEOUT: "180"
        IMAGE_UPLOAD_URL: ""
        IMAGE_DESCRIBE: "false"

# 只解密这一个域名。苹果自己的 guzzoni / gateway.icloud.com.cn 有 pinning，加进来没意义还会拖慢连接。
mitm:
  hostnames:
    - "prod-yabuli.qianwen.com"

http_captures:
  - "prod-yabuli.qianwen.com"
