name: "Apple 智能换模型（问千问 / 识图）"
description: "把国行 Apple 智能的「问千问」、视觉智能、写作工具改接到自定义 provider，并把百度识图换成 Google Lens。画图不接管，仍走千问。全部按原协议回包，界面无感知。"
author: "Li Khixang"
homepage: "https://github.com/Likhixang"
manual: "https://raw.githubusercontent.com/Likhixang/Egerny/main/markdown/AppleIntelligence-Qwen.md"
icon: "sparkles"

# 两项能力各自独立：Siri 那套需要 PROVIDER_URL/MODEL，识图那套需要 SERPAPI_KEY。
# 没填的部分不会接管，原样走苹果/百度。
env_schema:
  PROVIDER_URL:
    name: 接口地址
    description: "Siri / 写作工具用的 OpenAI 兼容接口。填到 /v1 即可，会自动补 /chat/completions。"
    default_value: "https://api.openai.com/v1"
  API_KEY:
    name: 密钥
    description: "Bearer 密钥。本地网关无鉴权时留空。"
    default_value: ""
  MODEL:
    name: 模型
    description: "传给 provider 的 model 字段。Egern 的 env_schema 选项是静态数组，没法在填完地址和密钥后动态拉 /models，所以这里只能手填。"
    default_value: ""
  EFFORT:
    name: 思考强度
    description: "按 OpenAI 兼容的 reasoning_effort 发送：default 不发送、交给模型默认；off 发 none；low/medium/high/xhigh/max 原样发送。provider 不认这个字段时会由上游决定是否报错。"
    options:
      - "default"
      - "off"
      - "low"
      - "medium"
      - "high"
      - "xhigh"
      - "max"
    default_value: "default"
  EXTRA_BODY:
    name: 额外请求字段
    description: "可选 JSON 对象，原样并入请求体（如 {\"enable_thinking\":true}）。model / messages / stream 不会被覆盖。"
    default_value: ""
  SYSTEM_PROMPT:
    name: 系统提示词
    description: "留空使用内置默认。默认原文：Your answer must remain neutral, be accurate, and sound natural in spoken language. Output only the final answer."
    default_value: ""
  VISION_MODEL:
    name: 视觉模型
    description: "处理视觉智能图片时用的模型；留空复用上面的模型。主模型不支持图片时填一个多模态模型。"
    default_value: ""
  VISION_PROMPT:
    name: 视觉提示词
    description: "视觉智能只发图片、不发文字，用这句引导模型作答。留空用内置默认。"
    default_value: ""
  WRITING_MODEL:
    name: 写作模型
    description: "写作工具改写用的模型；留空复用上面的模型。改写质量要求高时单独指一个更强的。"
    default_value: ""
  WRITING_PROMPT:
    name: 写作提示词
    description: "写作工具的系统提示词，必须让模型输出 {body, refinements}。留空用内置默认。"
    default_value: ""
  SERPAPI_KEY:
    name: SerpAPI 密钥
    description: "识图用。到 serpapi.com 拿 key，免费 250 次/月。留空则识图继续走百度。"
    default_value: ""
  HL:
    name: 识图语言
    description: "Google 语言代码，默认 zh-cn。"
    default_value: "zh-cn"
  COUNTRY:
    name: 识图国家
    description: "Google 国家代码，默认 us。"
    default_value: "us"
  LENS_TYPE:
    name: 识图类型
    description: "all 综合 / visual_matches 相似图片 / exact_matches 完全相同。"
    options:
      - "all"
      - "visual_matches"
      - "exact_matches"
    default_value: "all"
  TIMEOUT:
    name: 超时秒数
    description: "等待上游或 SerpAPI 的时间，默认 120，最大 300。"
    default_value: "120"
  REPORT_MODEL:
    name: 上报模型名
    description: "回给 Siri 的 model 字段，默认与真实后端一致。"
    default_value: "qwenapp-apple-tqa"
  CONTINUE_URL:
    name: 跳转链接
    description: "Siri 回答下方的「继续在 App 中查看」。留空则不显示。"
    default_value: ""
  NOTIFY_ON_ERROR:
    name: 出错时通知
    description: "上游失败或识图失败时发系统通知，便于排查。"
    options:
      - "true"
      - "false"
    default_value: "true"

scriptings:
  - http_request:
      name: "Apple-Intelligence"
      # Siri 对话 / 视觉智能 / 写作工具 + 百度识图
      match: "^https://(prod-yabuli\\.qianwen\\.com/v1/sessions(/sess_[^/?#]+)?/responses|qianfan\\.baidubce\\.com/v1/images/search)"
      script_url: "https://raw.githubusercontent.com/Likhixang/Egerny/main/js/AppleIntelligence-Qwen.js"
      body_required: true
      max_size: 4194304   # 视觉智能的请求体带 base64 图片，实测约 200KB，留足余量
      timeout: 300
      env:
        # 留空占位：模块设置页（env_schema）写入的模块级 env 会覆盖这里的同名值。
        PROVIDER_URL: ""
        API_KEY: ""
        MODEL: ""
        EFFORT: "default"
        EXTRA_BODY: ""
        SYSTEM_PROMPT: ""
        VISION_MODEL: ""
        VISION_PROMPT: ""
        WRITING_MODEL: ""
        WRITING_PROMPT: ""
        SERPAPI_KEY: ""
        HL: "zh-cn"
        COUNTRY: "us"
        LENS_TYPE: "all"
        TIMEOUT: "120"
        REPORT_MODEL: "qwenapp-apple-tqa"
        CONTINUE_URL: ""
        NOTIFY_ON_ERROR: "true"

# 只解密这两个域名。苹果自己的 guzzoni / gateway.icloud.com.cn 有 pinning，加进来没意义还会拖慢连接。
mitm:
  hostnames:
    - "prod-yabuli.qianwen.com"
    - "qianfan.baidubce.com"

http_captures:
  - "prod-yabuli.qianwen.com"
  - "qianfan.baidubce.com"
