name: "IP 质检"
description: "双源节点 IP 质检（Net.Coffee + IPFinal），Apple HIG 轻量现代设计，支持双源并列或单源查询"

# 策略组路由参数（用于规则匹配）
compat_arguments:
  Proxy: "DIRECT"
compat_arguments_desc: |
  Proxy: 检测请求走的策略组，默认 DIRECT

# 模块可视化配置控件 (Egern 2.16+)
env_schema:
  Source:
    name: 数据源
    description: "默认双源并列对比；也可只查 Net.Coffee 或只查 IPFinal"
    default_value: "双源"
    options:
      - "双源"
      - "Net.Coffee"
      - "IPFinal"
  MarkIP:
    name: IP 打码
    description: "是否对 IP 地址打码显示"
    options:
      - "true"
      - "false"

scriptings:
  - generic:
      name: IPCheck
      script_url: https://raw.githubusercontent.com/Likhixang/Egerny/main/js/IPCheck-widget.js
      timeout: 20
      update_interval: 300
      env:
        Source: "双源"
        MarkIP: "false"

widgets:
  - name: IPCheck
    script_name: IPCheck

rules:
  - domain_suffix:
      match: ip.net.coffee
      policy: "{{{Proxy}}}"
  - domain_suffix:
      match: ipfinal.com
      policy: "{{{Proxy}}}"
