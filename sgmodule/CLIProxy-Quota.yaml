name: "CLIProxy-Quota"
description: "CLIProxy 额度监控（5小时模型配额、账号状态与调用统计），新式小组件，支持全部主屏与锁屏尺寸"

# 模块可视化配置控件 (Egern 2.16+)
env_schema:
  SERVER_URL:
    name: 服务地址
    description: "CLIProxy 服务地址，如 http://127.0.0.1:8317 或局域网/公网地址"
    default_value: "http://127.0.0.1:8317"
  MANAGEMENT_KEY:
    name: 管理密钥
    description: "CLIProxy Management Key（若开启管理鉴权需填写）"
    default_value: ""
  MASK_EMAIL:
    name: 账号邮箱打码
    description: "是否对账号和邮箱进行打码隐藏"
    options:
      - "false"
      - "true"
  FILTER:
    name: 过滤筛选
    description: "筛选指定模型、账号关键字或序号（选填）"
    default_value: ""

scriptings:
  - generic:
      name: CLIProxy-Quota
      script_url: https://raw.githubusercontent.com/Likhixang/Egerny/main/js/CLIProxy-Quota.js
      timeout: 20
      env:
        SERVER_URL: "http://127.0.0.1:8317"
        MANAGEMENT_KEY: ""
        MASK_EMAIL: "false"
        FILTER: ""

widgets:
  - name: CLIProxy-Quota
    script_name: CLIProxy-Quota
