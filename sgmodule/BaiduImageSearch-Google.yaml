name: "百度识图换 Google Lens"
description: "把国行 iPhone 视觉搜索的百度识图改接到 Google Lens（SerpAPI）。拦截 qianfan.baidubce.com，回包仍是百度 schema，界面无感知；失败自动回退百度。"
author: "Li Khixang"
homepage: "https://github.com/Likhixang"
manual: "https://raw.githubusercontent.com/Likhixang/Egerny/main/markdown/BaiduImageSearch-Google.md"
icon: "search"

# 没填 SERPAPI_KEY 时脚本直接放行，视觉搜索继续走百度。
env_schema:
  SERPAPI_KEY:
    name: SerpAPI 密钥
    description: "https://serpapi.com 的 API key，免费额度 250 次/月。留空则完全不接管，仍用百度识图。"
    default_value: ""
  HL:
    name: 语言
    description: "Google 语言代码，默认 zh-cn。"
    default_value: "zh-cn"
  COUNTRY:
    name: 国家
    description: "Google 国家代码，默认 cn。"
    default_value: "cn"
  LENS_TYPE:
    name: 搜索类型
    description: "all 综合 / visual_matches 相似图片 / exact_matches 完全相同。"
    options:
      - "all"
      - "visual_matches"
      - "exact_matches"
    default_value: "all"
  THUMB_PROXY:
    name: 缩略图代理前缀
    description: "Google 缩略图在墙内可能打不开。填一个图片代理前缀（例如 https://wsrv.nl/?url=），脚本会把缩略图地址拼在后面；留空保持原地址。"
    default_value: ""
  TIMEOUT:
    name: 超时秒数
    description: "等待 SerpAPI 的时间，默认 45。"
    default_value: "45"
  NOTIFY_ON_ERROR:
    name: 失败时通知
    description: "SerpAPI 不可用时发系统通知，并回退百度。"
    options:
      - "true"
      - "false"
    default_value: "true"

scriptings:
  - http_request:
      name: "Baidu-Image-Search-Google"
      match: "^https://qianfan\\.baidubce\\.com/v1/images/search"
      script_url: "https://raw.githubusercontent.com/Likhixang/Egerny/main/js/BaiduImageSearch-Google.js"
      body_required: true
      max_size: 4194304   # 手机端图片约 20–30KB，留足余量
      timeout: 300
      env:
        SERPAPI_KEY: ""
        HL: "zh-cn"
        COUNTRY: "cn"
        LENS_TYPE: "all"
        THUMB_PROXY: ""
        TIMEOUT: "45"
        NOTIFY_ON_ERROR: "true"

mitm:
  hostnames:
    - "qianfan.baidubce.com"

http_captures:
  - "qianfan.baidubce.com"
